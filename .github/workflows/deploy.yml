name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      runner_label:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment_name }}
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 15
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false

    steps:
      - name: Deploy locally
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH:-}" ] || [ "${DEPLOY_PATH}" = "/" ]; then
            echo "DEPLOY_PATH must point to a deployment directory."
            exit 1
          fi

          cd -- "${DEPLOY_PATH}"

          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans --wait --wait-timeout 120
          docker compose ps

          docker image prune -f
