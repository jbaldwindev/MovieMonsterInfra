name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      runner_label:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment_name }}
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 15
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false

    steps:
      - name: Deploy locally
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          LOCAL_JDBC_DATABASE_PASSWORD: ${{ secrets.LOCAL_JDBC_DATABASE_PASSWORD }}
          LOCAL_JWT_SECRET: ${{ secrets.LOCAL_JWT_SECRET }}
          LOCAL_S3_ACCESS_KEY: ${{ secrets.LOCAL_S3_ACCESS_KEY }}
          LOCAL_S3_SECRET_KEY: ${{ secrets.LOCAL_S3_SECRET_KEY }}
          LOCAL_TMDB_KEY: ${{ secrets.LOCAL_TMDB_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_API_ORIGIN: ${{ vars.FRONTEND_API_ORIGIN }}
          LOCAL_APP_CORS_ALLOWED_ORIGINS: ${{ vars.LOCAL_APP_CORS_ALLOWED_ORIGINS }}
          LOCAL_JDBC_DATABASE_URL: ${{ vars.LOCAL_JDBC_DATABASE_URL }}
          LOCAL_JDBC_DATABASE_USERNAME: ${{ vars.LOCAL_JDBC_DATABASE_USERNAME }}
          LOCAL_S3_BUCKET_NAME: ${{ vars.LOCAL_S3_BUCKET_NAME }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH:-}" ] || [ "${DEPLOY_PATH}" = "/" ]; then
            echo "DEPLOY_PATH must point to a deployment directory."
            exit 1
          fi

          cd -- "${DEPLOY_PATH}"

          echo "Current directory:"
          pwd
          echo "Current user:"
          whoami
          echo "Identity:"
          id
          echo "Directory contents:"
          ls -la
          
          cat > .env <<EOF
          LOCAL_JDBC_DATABASE_PASSWORD=${LOCAL_JDBC_DATABASE_PASSWORD}
          LOCAL_JWT_SECRET=${LOCAL_JWT_SECRET}
          LOCAL_S3_ACCESS_KEY=${LOCAL_S3_ACCESS_KEY}
          LOCAL_S3_SECRET_KEY=${LOCAL_S3_SECRET_KEY}
          LOCAL_TMDB_KEY=${LOCAL_TMDB_KEY}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          FRONTEND_API_ORIGIN=${FRONTEND_API_ORIGIN}
          LOCAL_APP_CORS_ALLOWED_ORIGINS=${LOCAL_APP_CORS_ALLOWED_ORIGINS}
          LOCAL_JDBC_DATABASE_URL=${LOCAL_JDBC_DATABASE_URL}
          LOCAL_JDBC_DATABASE_USERNAME=${LOCAL_JDBC_DATABASE_USERNAME}
          LOCAL_S3_BUCKET_NAME=${LOCAL_S3_BUCKET_NAME}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
          EOF
          
          docker compose config --quiet
                    docker compose config --quiet

          for i in 1 2 3; do
            if docker compose pull; then
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "docker compose pull failed after 3 attempts."
              exit 1
            fi

            echo "docker compose pull failed. Retrying in 10 seconds..."
            sleep 10
          done

          docker compose up -d --remove-orphans --wait --wait-timeout 120
          docker compose up -d --remove-orphans --wait --wait-timeout 120
          docker compose ps

          docker image prune -f
